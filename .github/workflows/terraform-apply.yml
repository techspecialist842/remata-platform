name: Terraform Apply (infra changes)

# Manual only, on purpose — infra changes (VPC/RDS/ALB/IAM) are higher
# blast-radius than an app deploy and use a separate, more privileged role
# (see infra/terraform/bootstrap). Configure a GitHub Environment named
# "infra-<env>" with required reviewers (Settings > Environments) to force
# a human approval before this can run against staging/prod.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Which stack'
        type: choice
        options: [bootstrap, dev, staging, prod]
        required: true
      action:
        description: 'plan or apply'
        type: choice
        options: [plan, apply]
        default: plan
      activate_https:
        description: 'Activate HTTPS (only after the ACM cert shows ISSUED -- see acm_certificate_status output from a prior plan)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: terraform ${{ inputs.action }} — ${{ inputs.stack }}
    runs-on: ubuntu-latest
    environment: infra-${{ inputs.stack }}
    defaults:
      run:
        working-directory: ${{ inputs.stack == 'bootstrap' && 'infra/terraform/bootstrap' || format('infra/terraform/environments/{0}', inputs.stack) }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: |
          if [ "${{ inputs.stack }}" = "bootstrap" ]; then
            terraform init -input=false
          else
            terraform init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=${{ inputs.stack }}/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          fi

      - name: Build -var flags (environment stacks only)
        id: vars
        if: inputs.stack != 'bootstrap'
        env:
          CONTAINER_IMAGE: ${{ vars.CONTAINER_IMAGE_INITIAL || 'public.ecr.aws/docker/library/hello-world:latest' }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN || '' }}
          STACK: ${{ inputs.stack }}
          ACTIVATE_HTTPS: ${{ inputs.activate_https }}
        run: |
          # prod serves on the bare apex domain; dev/staging get a subdomain.
          # Empty ROOT_DOMAIN means no domain configured yet -- HTTPS support
          # stays inert (domain_name empty), same as before this existed.
          # DNS is managed externally (Cloudflare), not Route53 -- see
          # modules/alb for the acm_validation_record / acm_certificate_status
          # outputs that drive the manual DNS steps.
          if [ -z "$ROOT_DOMAIN" ]; then
            DOMAIN=""
          elif [ "$STACK" = "prod" ]; then
            DOMAIN="$ROOT_DOMAIN"
          else
            DOMAIN="${STACK}.${ROOT_DOMAIN}"
          fi
          echo "flags=-var=aws_region=${{ vars.AWS_REGION }} -var=container_image=$CONTAINER_IMAGE -var=alert_email=${{ vars.ALERT_EMAIL || '' }} -var=domain_name=$DOMAIN -var=activate_https=$ACTIVATE_HTTPS" >> "$GITHUB_OUTPUT"
          # container_image only matters on the very first apply — the ECS
          # service's task_definition is ignore_changes'd afterward, so
          # real deploys always go through deploy.yml, never through here.

      - name: terraform plan
        run: terraform plan -input=false ${{ steps.vars.outputs.flags }} -out=tfplan

      - name: terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show DNS/HTTPS outputs (environment stacks only)
        if: inputs.action == 'apply' && inputs.stack != 'bootstrap'
        run: |
          echo "--- acm_validation_record (add this CNAME at Cloudflare) ---"
          terraform output acm_validation_record
          echo "--- acm_certificate_status ---"
          terraform output acm_certificate_status
