name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Real Postgres, not mocks: the e2e suite exercises actual migrations and
    # actual role-based access, which is the point of the Fase 1 acceptance
    # criteria ("cubiertas por pruebas automatizadas de humo/contrato en CI").
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: remata
          POSTGRES_PASSWORD: remata
          POSTGRES_DB: remata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://remata:remata@localhost:5432/remata
      DB_SSL: 'false'
      JWT_ACCESS_SECRET: ci-access-secret-not-for-prod
      JWT_ENROLLMENT_SECRET: ci-enrollment-secret-not-for-prod
      FRAUD_POLICY: fail-open
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --ci
      - run: npm run build
      - run: npm run migration:run
      - run: npm run test:e2e -- --ci

      - name: Build Docker image (no push — validates the Dockerfile only)
        run: docker build -t remata-api:ci .

  terraform:
    name: Terraform — fmt & validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, environments/dev, environments/staging, environments/prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: terraform fmt -check
        working-directory: infra/terraform/${{ matrix.stack }}
        run: terraform fmt -check -diff

      - name: terraform init (no backend — syntax/reference check only)
        working-directory: infra/terraform/${{ matrix.stack }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/terraform/${{ matrix.stack }}
        run: terraform validate
