name: Deploy API

# Auto-deploys to staging on every push to main. Dev/prod are manual —
# prod additionally requires whoever configures the repo's "prod" GitHub
# Environment to add required reviewers (Settings > Environments), since
# that's not something Terraform/this workflow can set on its own.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, staging, prod]
        default: staging

permissions:
  id-token: write # required for OIDC — no long-lived AWS keys in secrets
  contents: read

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    outputs:
      image: ${{ steps.build.outputs.image }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build, tag, push
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: remata-api
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${ENVIRONMENT}-${IMAGE_TAG}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$TAG"

          # ECR tags are immutable, and this tag is derived from the commit SHA,
          # so an existing tag is by definition already the right image for this
          # commit. Reuse it rather than pushing again.
          #
          # Without this, any deploy that fails AFTER the push — a bad migration,
          # an unstable service — can never be re-run: the retry dies on "tag
          # already exists" before reaching the step that actually failed. That
          # is precisely when you least want the pipeline to be unusable.
          #
          # Uses batch-get-image (not describe-images) because the deploy role is
          # already granted ecr:BatchGetImage; describe-images would need a new
          # IAM permission for no added benefit.
          FOUND=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'length(images)' --output text 2>/dev/null || echo 0)

          if [ "$FOUND" != "0" ]; then
            echo "Image for this commit already in ECR — reusing it: $IMAGE_URI"
          else
            docker build -t "$IMAGE_URI" .
            docker push "$IMAGE_URI"
          fi

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Render new task definition
        id: render
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "remata-${ENVIRONMENT}-api" \
            --query taskDefinition > task-definition.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: task-def
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Register new task definition revision
        id: register
        env:
          TASK_DEF_FILE: ${{ steps.task-def.outputs.task-definition }}
        run: |
          set -euo pipefail
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$TASK_DEF_FILE" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$ARN" >> "$GITHUB_OUTPUT"

      # Runs `npm run migration:run:prod` once, using the NEW image, before any
      # live traffic reaches it — a broken migration fails the deploy here
      # instead of surfacing as a runtime error against the running service.
      - name: Run database migrations
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          CLUSTER: remata-${{ inputs.environment || 'staging' }}
          SERVICE: remata-${{ inputs.environment || 'staging' }}-api
          TASK_DEF_ARN: ${{ steps.register.outputs.task_def_arn }}
        run: |
          set -euo pipefail
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"api","command":["npm","run","migration:run:prod"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          TASK_ID="${TASK_ARN##*/}"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task exited with code '$EXIT_CODE' (or crashed before exiting). Log stream: api/api/$TASK_ID"
            aws logs filter-log-events \
              --log-group-name "/ecs/remata-${ENVIRONMENT}-api" \
              --log-stream-names "api/api/$TASK_ID" \
              --query 'events[].message' --output text || true
            exit 1
          fi
          echo "Migrations applied successfully."

      - name: Update service to the new task definition
        env:
          CLUSTER: remata-${{ inputs.environment || 'staging' }}
          SERVICE: remata-${{ inputs.environment || 'staging' }}-api
          TASK_DEF_ARN: ${{ steps.register.outputs.task_def_arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$TASK_DEF_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
